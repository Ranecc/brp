openapi: 3.1.0
info:
  title: BRP Backend API
  version: 0.1.0
  description: >
    Better Resource Plan backend. Three planes (docs/01-architecture.md):
    command (REST writes, idempotent), telemetry (batched, eventId-deduped),
    push (poll+ack v0, SSE planned). v0 assumes trusted network; instance
    HMAC auth lands in P1.

servers:
  - url: http://localhost:8080

paths:
  /api/v1/tenants/{tenantId}/accounts:
    post:
      summary: Create an account (PLAYER | TEAM | SYSTEM_SINK | SYSTEM_FAUCET | ESCROW)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAccountRequest'}
      responses:
        "200": {description: created, content: {application/json: {schema: {$ref: '#/components/schemas/AccountDto'}}}}
        "409": {description: account already exists}
    get:
      summary: List accounts with balances
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccountDto'}}}}}

  /api/v1/tenants/{tenantId}/journal:
    post:
      summary: Post a double-entry journal (idempotent)
      description: >
        Duplicate idempotencyKey replays the original response (replayed=true).
        Concurrent losers of the key race get the winner's snapshot. Unbalanced
        journals are rejected with 400.
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostJournalRequest'}
      responses:
        "200": {description: posted or replayed, content: {application/json: {schema: {$ref: '#/components/schemas/PostJournalResponse'}}}}
        "400": {description: unbalanced or unknown account}
        "409": {description: concurrent update, retry same key}

  /api/v1/telemetry/batches:
    post:
      summary: Ingest an event batch (at-least-once, dedup by eventId)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelemetryBatch'}
      responses:
        "200": {description: ack with duplicate count, content: {application/json: {schema: {$ref: '#/components/schemas/TelemetryAck'}}}}
        "400": {description: batch too large or malformed}

  /api/v1/approvals/requests:
    post:
      summary: Submit a treasury withdrawal request (the begging begins)
      description: >
        Rubber-stamp threshold auto-approves and executes; upper-management
        threshold escalates to OWNER approval. Idempotent on idempotencyKey.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey, teamId, requesterUuid, amountCents]
              properties:
                idempotencyKey: {type: string}
                teamId: {type: string}
                requesterUuid: {type: string}
                amountCents: {type: integer, format: int64}
                memo: {type: string}
      responses:
        "200": {description: "request state (PENDING / AWAITING_UPPER_MANAGEMENT / EXECUTED)"}
        "400": {description: "requester not on the roster; HR declines to process"}
    get:
      summary: The team's approval inbox (default status=PENDING)
      parameters:
        - {name: teamId, in: query, required: true, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        "200": {description: pending paperwork, faithfully listed}

  /api/v1/approvals/requests/{id}/approve:
    post:
      summary: Approve (OFFICER+; OWNER required above the upper-management threshold)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approverUuid]
              properties:
                approverUuid: {type: string}
                note: {type: string}
      responses:
        "200": {description: "EXECUTED via the vault-withdraw saga (freeze -> dispense -> settle)"}
        "409": {description: "already decided, or insufficient org-chart altitude"}

  /api/v1/approvals/requests/{id}/reject:
    post:
      summary: Reject with a note ("circle back next quarter")
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: REJECTED, treasury untouched}

  /api/v1/approvals/requests/{id}/nudge:
    post:
      summary: "'Per my last email' — the sacred reminder ritual"
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: "reminder sent, corporate buzzword attached"}
        "409": {description: "nudging a settled request is corporate cardio"}

  /api/v1/tps-reports/weekly:
    get:
      summary: Weekly TPS report (yes, that kind of TPS)
      parameters:
        - {name: withCoverSheet, in: query, schema: {type: boolean, default: true}}
      responses:
        "200": {description: "synergy metrics, flair count, Monday detection"}
        "400": {description: "TPS reports now require a cover sheet. Didn't you get the memo?"}

  /api/v1/economy/daily:
    get:
      summary: Today's money printer status (M / net emission / traded volume / velocity V)
      description: Materialized from the ledger only — if it didn't journal, it didn't happen.
      parameters:
        - {name: currency, in: query, schema: {type: string, default: BRC}}
      responses:
        "200":
          description: "the observable economy; velocity is Fisher's paranoia channel"

  /api/v1/economy/history:
    get:
      summary: Daily economy history for a currency
      parameters:
        - {name: currency, in: query, schema: {type: string, default: BRC}}
      responses:
        "200": {description: previous printer statuses, faithfully archived}

  /api/v1/players/batch:
    post:
      summary: Bulk upsert player identity (agent-pulled uuid/name, rename history kept)
      description: Idempotent on batchId (@Idempotent) and atomic per batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, players]
              properties:
                batchId: {type: string}
                players:
                  type: array
                  items:
                    type: object
                    required: [uuid, name]
                    properties:
                      uuid: {type: string}
                      name: {type: string}
      responses:
        "200":
          description: "{inserted, renamed, refreshed} (replayed identically on duplicate batchId)"

  /api/v1/tenants/{tenantId}/inventory/snapshots:
    post:
      summary: Upsert inventory snapshots (SNAPSHOT or DELTA batch)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryBatch'}
      responses:
        "200": {description: upserted count}

  /api/v1/tenants/{tenantId}/signals:
    post:
      summary: Enqueue a signal command (policy engine entrypoint)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignalSetCommand'}
      responses:
        "200": {description: queued command}

  /api/v1/tenants/{tenantId}/signals/poll:
    get:
      summary: Agent polls pending signal commands
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: pending commands + cursor}

  /api/v1/tenants/{tenantId}/signals/ack:
    post:
      summary: Agent acknowledges executed commands (marks DELIVERED)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: acked}

components:
  schemas:
    CreateAccountRequest:
      type: object
      required: [accountNo, accountType, currency]
      properties:
        accountNo: {type: string}
        accountType: {type: string, enum: [PLAYER, TEAM, SYSTEM_SINK, SYSTEM_FAUCET, ESCROW]}
        currency: {type: string}
    AccountDto:
      type: object
      properties:
        id: {type: integer, format: int64}
        accountNo: {type: string}
        accountType: {type: string}
        currency: {type: string}
        balanceCents: {type: integer, format: int64}
    JournalLine:
      type: object
      required: [accountNo, direction, amountCents]
      properties:
        accountNo: {type: string}
        direction: {type: string, enum: [DEBIT, CREDIT]}
        amountCents: {type: integer, format: int64, minimum: 1}
        memo: {type: string}
    PostJournalRequest:
      type: object
      required: [idempotencyKey, currency, lines]
      properties:
        idempotencyKey: {type: string}
        currency: {type: string}
        lines: {type: array, items: {$ref: '#/components/schemas/JournalLine'}}
    PostJournalResponse:
      type: object
      properties:
        journalId: {type: string}
        replayed: {type: boolean}
        affectedAccounts: {type: array, items: {$ref: '#/components/schemas/AccountDto'}}
    EventEnvelope:
      type: object
      required: [eventId, type, schemaVersion, agentId]
      properties:
        eventId: {type: string}
        type: {type: string}
        schemaVersion: {type: integer}
        agentId: {type: string}
        tenantId: {type: string}
        occurredAt: {type: string}
        reliability: {type: string, enum: [CRITICAL, TELEMETRY]}
        payload: {type: object}
    TelemetryBatch:
      type: object
      required: [events]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/EventEnvelope'}, maxItems: 1000}
    TelemetryAck:
      type: object
      properties:
        accepted: {type: integer}
        duplicates: {type: integer}
    InventoryLine:
      type: object
      required: [containerId, itemId, amount, capturedAt]
      properties:
        containerId: {type: string}
        itemId: {type: string}
        amount: {type: integer, format: int64}
        capturedAt: {type: string}
    InventoryBatch:
      type: object
      required: [batchMode, lines]
      properties:
        batchMode: {type: string, enum: [SNAPSHOT, DELTA]}
        lines: {type: array, items: {$ref: '#/components/schemas/InventoryLine'}}
    SignalSetCommand:
      type: object
      required: [channel, level]
      properties:
        channel: {type: string}
        level: {type: integer, minimum: 0, maximum: 15}
