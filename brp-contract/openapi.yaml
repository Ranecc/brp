openapi: 3.1.0
info:
  title: BRP Backend API
  version: 0.1.0
  description: >
    Better Resource Plan backend. Three planes (docs/01-architecture.md):
    command (REST writes, idempotent), telemetry (batched, eventId-deduped),
    push (poll+ack v0, SSE planned). v0 assumes trusted network; instance
    HMAC auth lands in P1.

servers:
  - url: http://localhost:8080

paths:
  /api/v1/tenants/{tenantId}/accounts:
    post:
      summary: Create an account (PLAYER | TEAM | SYSTEM_SINK | SYSTEM_FAUCET | ESCROW)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAccountRequest'}
      responses:
        "200": {description: created, content: {application/json: {schema: {$ref: '#/components/schemas/AccountDto'}}}}
        "409": {description: account already exists}
    get:
      summary: List accounts with balances
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccountDto'}}}}}

  /api/v1/tenants/{tenantId}/journal:
    post:
      summary: Post a double-entry journal (idempotent)
      description: >
        Duplicate idempotencyKey replays the original response (replayed=true).
        Concurrent losers of the key race get the winner's snapshot. Unbalanced
        journals are rejected with 400.
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostJournalRequest'}
      responses:
        "200": {description: posted or replayed, content: {application/json: {schema: {$ref: '#/components/schemas/PostJournalResponse'}}}}
        "400": {description: unbalanced or unknown account}
        "409": {description: concurrent update, retry same key}

  /api/v1/telemetry/batches:
    post:
      summary: Ingest an event batch (at-least-once, dedup by eventId)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelemetryBatch'}
      responses:
        "200": {description: ack with duplicate count, content: {application/json: {schema: {$ref: '#/components/schemas/TelemetryAck'}}}}
        "400": {description: batch too large or malformed}

  /api/v1/approvals/requests:
    post:
      summary: Submit a treasury withdrawal request (the begging begins)
      description: >
        Rubber-stamp threshold auto-approves and executes; upper-management
        threshold escalates to OWNER approval. Idempotent on idempotencyKey.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey, teamId, requesterUuid, amountCents]
              properties:
                idempotencyKey: {type: string}
                teamId: {type: string}
                requesterUuid: {type: string}
                amountCents: {type: integer, format: int64}
                memo: {type: string}
      responses:
        "200": {description: "request state (PENDING / AWAITING_UPPER_MANAGEMENT / EXECUTED)"}
        "400": {description: "requester not on the roster; HR declines to process"}
    get:
      summary: The team's approval inbox (default status=PENDING)
      parameters:
        - {name: teamId, in: query, required: true, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        "200": {description: pending paperwork, faithfully listed}

  /api/v1/approvals/requests/{id}/approve:
    post:
      summary: Approve (OFFICER+; OWNER required above the upper-management threshold)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approverUuid]
              properties:
                approverUuid: {type: string}
                note: {type: string}
      responses:
        "200": {description: "EXECUTED via the vault-withdraw saga (freeze -> dispense -> settle)"}
        "409": {description: "already decided, or insufficient org-chart altitude"}

  /api/v1/approvals/requests/{id}/reject:
    post:
      summary: Reject with a note ("circle back next quarter")
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: REJECTED, treasury untouched}

  /api/v1/approvals/requests/{id}/nudge:
    post:
      summary: "'Per my last email' — the sacred reminder ritual"
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: "reminder sent, corporate buzzword attached"}
        "409": {description: "nudging a settled request is corporate cardio"}

  /api/v1/tps-reports/weekly:
    get:
      summary: Weekly TPS report (yes, that kind of TPS)
      parameters:
        - {name: withCoverSheet, in: query, schema: {type: boolean, default: true}}
      responses:
        "200": {description: "synergy metrics, flair count, Monday detection"}
        "400": {description: "TPS reports now require a cover sheet. Didn't you get the memo?"}

  /api/v1/economy/daily:
    get:
      summary: Today's money printer status (M / net emission / traded volume / velocity V)
      description: Materialized from the ledger only — if it didn't journal, it didn't happen.
      parameters:
        - {name: currency, in: query, schema: {type: string, default: BRC}}
      responses:
        "200":
          description: "the observable economy; velocity is Fisher's paranoia channel"

  /api/v1/economy/history:
    get:
      summary: Daily economy history for a currency
      parameters:
        - {name: currency, in: query, schema: {type: string, default: BRC}}
      responses:
        "200": {description: previous printer statuses, faithfully archived}

  /api/v1/currencies/{code}:
    patch:
      summary: Edit display fields only (name/symbol/bearerItemId); code is immutable — rebranding is marketing, re-identifying is fraud
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, symbol]
              properties:
                name: {type: string}
                symbol: {type: string}
                bearerItemId: {type: string, nullable: true, description: null = pure ledger currency}
      responses:
        "200": {description: the currency, rebranded but same identity}
  /api/v1/currencies:
    post:
      summary: Register a currency (owner console; BRC ships pre-registered)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, symbol]
              properties:
                code: {type: string, maxLength: 8}
                name: {type: string}
                symbol: {type: string}
                decimals: {type: integer, minimum: 0, maximum: 8}
                bearerItemId: {type: string, nullable: true, description: the item the mint window dispenses (V11); null = pure ledger currency}
      responses:
        "200": {description: registered}
        "409": {description: duplicate code — minting duplicates is a three-letter agency's job}
    get:
      summary: List registered tender
      responses:
        "200": {description: the registry of legal tender}

  /api/v1/quotas/{tenantId}/{resource}:
    put:
      summary: Set a quota limit (0 = unlimited licensing)
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string}}
        - {name: resource, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit]
              properties:
                limit: {type: integer, format: int64, minimum: 0}
      responses:
        "200": {description: the bucket, updated}
  /api/v1/quotas/{tenantId}:
    get:
      summary: Quota usage for a tenant
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: usage rows}
  /api/v1/quotas/incidents:
    get:
      summary: Chunk gluttony incidents (OPEN until a human decides otherwise)
      parameters: [{name: tenantId, in: query, schema: {type: string}}]
      responses:
        "200": {description: the paperwork of server-eating chunks}
  /api/v1/chunks/{tenantId}:
    post:
      summary: Register a managed chunk slot (idempotent per tenant/dimension/chunkKey)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dimension, chunkKey]
              properties:
                dimension: {type: string}
                chunkKey: {type: string, description: '"x,z"'}
                registeredBy: {type: string}
      responses:
        "200": {description: the slot (re-registration returns the existing one)}
    get:
      summary: Managed chunk slots for a tenant
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: slot rows with credit balances}
  /api/v1/chunks/{tenantId}/{dimension}/{chunkKey}/purchase:
    post:
      summary: Buy chunk-load minutes (prepaid; money path through the ledger, idemKey guards money AND minutes)
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string}}
        - {name: dimension, in: path, required: true, schema: {type: string}}
        - {name: chunkKey, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes, idemKey]
              properties:
                minutes: {type: integer, format: int64, minimum: 1}
                idemKey: {type: string}
      responses:
        "200": {description: the slot with fresh credit; replays return the same answer}
  /api/v1/chunks/{tenantId}/governor:
    get:
      summary: Governor read model for the agent (RUN/THROTTLE/HALT per chunk, docs/09 §4)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: verdicts with stable reason codes}
  /api/v1/chunks/{tenantId}/{dimension}/{chunkKey}/power:
    put:
      summary: Admin remote switch (DISABLED = governor HALTs BRP machinery, never players)
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string}}
        - {name: dimension, in: path, required: true, schema: {type: string}}
        - {name: chunkKey, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200": {description: the slot, switched and audited}
  /api/v1/chunks/{tenantId}/{dimension}/{chunkKey}/grant:
    put:
      summary: Grant chunk-load minutes (FAUCET wiring lands with P2-05)
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string}}
        - {name: dimension, in: path, required: true, schema: {type: string}}
        - {name: chunkKey, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: {type: integer, format: int64, minimum: 1}
      responses:
        "200": {description: the slot, with fresh credit}

  /api/v1/monetary/regime:
    get:
      summary: The antitrust regime with hysteresis state (docs/12 §4)
      responses:
        "200": {description: "{name, state, lastReading, since}"}
  /api/v1/monetary/snapshot/run:
    post:
      summary: Capture the shared weekly snapshot (one truth per week)
      responses:
        "200": {description: "{weekOf, gini, topShare, regimeAfter, tenants[]}"}
        "409": {description: this week's snapshot already exists}
  /api/v1/monetary/snapshot/latest:
    get:
      summary: Latest weekly snapshot
      responses:
        "200": {description: snapshot rows or null before the first Monday}
  /api/v1/monetary/wealth/{weekOf}/assess:
    post:
      summary: Run the wealth levy for a week (regime-gated; replay-safe)
      parameters: [{name: weekOf, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: assessment rows}
  /api/v1/monetary/wealth/{weekOf}:
    get:
      summary: Wealth levy assessments for a week
      parameters: [{name: weekOf, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: assessment rows}
  /api/v1/monetary/vault:
    post:
      summary: Register a vault container (tenant, containerRef, bearer item)
      responses:
        "200": {description: registered}
  /api/v1/monetary/mint:
    post:
      summary: Mint window — FAUCET journal FIRST, dispense SECOND; compensations reverse
      responses:
        "200": {description: saga outcome (success may be false; compensations run)}
  /api/v1/monetary/vault/drift-check:
    post:
      summary: Books vs inventory snapshots per registered vault (BRP-0904 on drift)
      responses:
        "200": {description: one line per drifted container; empty = agreement}
  /api/v1/monetary/peg:
    get:
      summary: The two anchor legs with bands
      responses:
        "200": {description: peg rows}
  /api/v1/monetary/peg/{leg}/observe:
    post:
      summary: Feed a market reading; 2 consecutive misses file ONE repeg vote
      parameters: [{name: leg, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: accepted}
  /api/v1/monetary/policy-requests:
    get:
      summary: Pending policy requests (repeg votes live here; no third channel)
      responses:
        "200": {description: pending rows}
  /api/v1/monetary/policy-requests/{id}/decide:
    post:
      summary: Approve or reject; approved repeg votes execute atomically with history
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": {description: decided}
  /api/v1/monetary/gresham/scan:
    post:
      summary: Rail scan (behavioral, per-rail moving baseline; cold start = silent)
      responses:
        "200": {description: leg -> current-week share}
  /api/v1/monetary/wash/scan:
    post:
      summary: Wash-cycle SCC scan (cycles are legal commerce; scores carry accusations)
      responses:
        "200": {description: "{tenantsScanned, findingsFiled}"}
  /api/v1/monetary/wash/findings:
    get:
      summary: Suspected cycles, highest score first
      responses:
        "200": {description: finding rows}
  /api/v1/monetary/prices:
    post:
      summary: Record a market price observation (CPI's food chain)
      responses:
        "200": {description: recorded}
  /api/v1/monetary/cpi/run:
    post:
      summary: Compute today's CPI (geometric mean of item relatives; one print per day)
      responses:
        "200": {description: "{index}"}
  /api/v1/monetary/cpi:
    get:
      summary: CPI history, newest first
      responses:
        "200": {description: daily prints}

  /api/v1/aps/allocations:
    get:
      summary: Fair-share throttle factors per tenant (uniform haircut over global capacity)
      responses:
        "200": {description: tenant -> factor in (0,1]}
  /api/v1/aps/allocations/{tenantId}:
    get:
      summary: This tenant's factor (1.0 = full speed; the line gate turns it into skipped windows)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: "{factor}"}

  /api/v1/anomaly/rules:
    get:
      summary: L1 hot rules (rules are data, not code)
      responses:
        "200": {description: rule rows}
    post:
      summary: Create a hot rule (GT/GTE/LT/LTE/EQ on a numeric payload field)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, eventType, field, op, threshold]
              properties:
                name: {type: string}
                eventType: {type: string}
                field: {type: string}
                op: {type: string, enum: [GT, GTE, LT, LTE, EQ]}
                threshold: {type: number}
                severity: {type: string}
      responses:
        "200": {description: the rule, live on the next telemetry batch}
  /api/v1/anomaly/hits:
    get:
      summary: Recent rule firings (the paperwork of bad numbers)
      responses:
        "200": {description: hit rows}
  /api/v1/reconciliation/run:
    post:
      summary: Run the reconciliation desk now (also scheduled hourly)
      responses:
        "200": {description: "{currenciesChecked, findingsFiled}"}
  /api/v1/reconciliation/findings:
    get:
      summary: Imbalance findings, newest first
      responses:
        "200": {description: finding rows}

  /api/v1/teams:
    post:
      summary: Create a team (provisions the treasury account; docs/07)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, tag, ownerUuid]
              properties:
                correlationId: {type: string}
                id: {type: string}
                name: {type: string}
                tag: {type: string}
                ownerUuid: {type: string}
      responses:
        "200": {description: team created, treasury provisioned}
    get:
      summary: List teams (optionally by source NATIVE | FTBTEAMS)
      parameters: [{name: source, in: query, schema: {type: string}}]
      responses:
        "200": {description: team rows}
  /api/v1/teams/sync:
    post:
      summary: Compat sync — mirror an external provider's roster into BRP membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, source, teams]
              properties:
                batchId: {type: string}
                source: {type: string, description: FTBTEAMS or provider id}
                teams:
                  type: array
                  items: {type: object}
      responses:
        "200": {description: sync applied (idempotent per batchId)}
  /api/v1/players/batch:
    post:
      summary: Bulk upsert player identity (agent-pulled uuid/name, rename history kept)
      description: Idempotent on batchId (@Idempotent) and atomic per batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, players]
              properties:
                batchId: {type: string}
                players:
                  type: array
                  items:
                    type: object
                    required: [uuid, name]
                    properties:
                      uuid: {type: string}
                      name: {type: string}
      responses:
        "200":
          description: "{inserted, renamed, refreshed} (replayed identically on duplicate batchId)"

  /api/v1/tenants/{tenantId}/inventory/snapshots:
    post:
      summary: Upsert inventory snapshots (SNAPSHOT or DELTA batch)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryBatch'}
      responses:
        "200": {description: upserted count}

  /api/v1/tenants/{tenantId}/signals:
    post:
      summary: Enqueue a signal command (policy engine entrypoint)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignalSetCommand'}
      responses:
        "200": {description: queued command}

  /api/v1/tenants/{tenantId}/signals/poll:
    get:
      summary: Agent polls pending signal commands
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: pending commands + cursor}

  # --- P4: the load desk (docs/13) ---
  /api/v1/monetary/load/samples:
    get:
      summary: Minute-bucketed load samples (mspt, players, entities, chunks)
      parameters:
        - {name: hours, in: query, schema: {type: integer, default: 24}}
      responses:
        "200": {description: "[{bucketMinute, sampleCount, msptAvg, msptMax, playerMax, entityMax, chunkMax, forcedMax}]"}
  /api/v1/monetary/load/forecast:
    get:
      summary: Hourly mspt forecast with tariff classification (profile EWMA + damped live correction)
      parameters:
        - {name: hours, in: query, schema: {type: integer, default: 24}}
      responses:
        "200": {description: "{coldStart, profileDays, liveMspt, hours[{hourStart, predictedMspt, utilization, tariffLabel, multiplierPct, schedulable}]}"}
  /api/v1/monetary/load/profile/refresh:
    post:
      summary: Run the daily profile refresh (idempotent per date)
      responses:
        "200": {description: "{ran}"}
  /api/v1/monetary/tariff:
    get:
      summary: The versioned time-of-use tariff windows
      responses:
        "200": {description: "[{id, version, dayOfWeek, startMinute, endMinute, multiplierPct, label}]"}
  /api/v1/monetary/tariff/windows:
    post:
      summary: Publish the next tariff version (copies latest rows + the new window)
      responses:
        "200": {description: the created window}
        "400": {description: invalid window geometry or multiplier}
  /api/v1/monetary/dr/{tenantId}/jobs:
    get:
      summary: The tenant's deferrable jobs
      responses:
        "200": {description: "[{id, resource, estMinutes, status, awardedStart, windowSeq, shedCount}]"}
    post:
      summary: File a deferrable job (idempotent by idemKey)
      responses:
        "200": {description: the filed job}
        "400": {description: invalid window, or credit.restricted}
  /api/v1/monetary/dr/{tenantId}/jobs/{jobId}/cancel:
    post:
      summary: Cancel a FILED/AWARDED job, refunding the reservation
      responses:
        "200": {description: the cancelled job}
  /api/v1/monetary/dr/award:
    post:
      summary: Award feasible jobs to windows and dispatch due signals
      responses:
        "200": {description: "{awarded}"}
  /api/v1/monetary/dr/shed-check:
    post:
      summary: Shed running DR windows when live mspt breaches the budget
      responses:
        "200": {description: "{liveMspt}"}
  /api/v1/monetary/credit/{tenantId}:
    get:
      summary: The credit line (auto-created with an auto limit on first look)
      responses:
        "200": {description: "{limitCents, drawnCents, availableCents, utilizationPct, status, annualRatePct, limitPinned}"}
  /api/v1/monetary/credit/{tenantId}/limit:
    post:
      summary: Admin sets (and pins) the limit
      responses:
        "200": {description: the updated line}
  /api/v1/monetary/credit/{tenantId}/repay:
    post:
      summary: Repay debt from treasury cash (capped at drawn)
      responses:
        "200": {description: the updated line}
        "400": {description: credit.no.cash | credit.nothing.drawn}
  /api/v1/monetary/credit/{tenantId}/reinstate:
    post:
      summary: Admin-only exit from DEFAULTED (the machine re-runs from utilization)
      responses:
        "200": {description: the updated line}
  /api/v1/monetary/credit/{tenantId}/events:
    get:
      summary: The credit audit trail (DRAW|REPAY|INTEREST|LIMIT_SET|STATUS)
      responses:
        "200": {description: "[{kind, amountCents, memo, createdAt}]"}
  /api/v1/monetary/credit/desk/run:
    post:
      summary: Run the daily desk (sweep overdrafts, accrue interest, walk statuses)
      responses:
        "200": {description: "{ran}"}
  /api/v1/monetary/bonds:
    get:
      summary: All bond series
      responses:
        "200": {description: "[{id, name, faceCents, couponPctAnnual, termDays, totalUnits, soldUnits, thresholdMspt, status, maturesAt}]"}
    post:
      summary: Issue a series (OPEN; performance-settled at maturity)
      responses:
        "200": {description: the series}
  /api/v1/monetary/bonds/{seriesId}:
    get:
      summary: One series
      responses:
        "200": {description: the series}
  /api/v1/monetary/bonds/{seriesId}/subscribe/{tenantId}:
    post:
      summary: Escrow BRC into a position (one per tenant per series)
      responses:
        "200": {description: the subscription}
        "400": {description: bond.oversubscribed | bond.already.subscribed | credit.restricted}
  /api/v1/monetary/bonds/{seriesId}/close:
    post:
      summary: Close the book (full -> AWARDED; starving -> FAILED + refunds)
      responses:
        "200": {description: the series}
  /api/v1/monetary/bonds/accrual/run:
    post:
      summary: Daily coupon accrual (idempotent per series/tenant/day)
      responses:
        "200": {description: "{accrued}"}
  /api/v1/monetary/bonds/settle/run:
    post:
      summary: Settle matured series; coupons x performanceFactor, principal whole
      responses:
        "200": {description: "[seriesId]"}
  /api/v1/market/book:
    get:
      summary: All resting orders
      responses:
        "200": {description: "[{id, tenantId, side, qty, qtyRemaining, priceCents, status}]"}
  /api/v1/market/{tenantId}/orders:
    get:
      summary: The tenant's orders
      responses:
        "200": {description: "[...]"}
    post:
      summary: Place an order (peg-banded price; ASKs lock quota, BIDs escrow BRC)
      responses:
        "200": {description: the order}
        "400": {description: market.price.outside.band | market.cant.cover | credit.restricted}
  /api/v1/market/{tenantId}/orders/{orderId}/cancel:
    post:
      summary: Cancel a resting order and release its collateral
      responses:
        "200": {description: the order}
  /api/v1/market/expire:
    post:
      summary: Expire stale orders and release escrows
      responses:
        "200": {description: "{expired}"}
  /api/v1/aps/shopfloor/{tenantId}/downtime:
    get:
      summary: The downtime ledger
      responses:
        "200": {description: "[{machine, reason, since, until, minutes}]"}
    post:
      summary: Record a stoppage (idempotent by key)
      responses:
        "200": {description: the event}
  /api/v1/aps/shopfloor/{tenantId}/oee:
    get:
      summary: Weekly OEE — availability x performance, quality disclosed as 1.0
      parameters:
        - {name: weekOf, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: "{downtimeMinutes, availability, performance, quality, oee, performanceColdStart}"}
  /api/v1/aps/shopfloor/{tenantId}/assets:
    get:
      summary: The asset registry
      responses:
        "200": {description: "[{kind, label, locationChunk, costBasisCents, status}]"}
    post:
      summary: Register an asset (handover result)
      responses:
        "200": {description: the asset}
  /api/v1/aps/shopfloor/{tenantId}/assets/{assetId}/retire:
    post:
      summary: Retire an asset
      responses:
        "200": {description: the asset}
  /api/v1/aps/shopfloor/{tenantId}/workorders/{ref}/stamp:
    post:
      summary: Stamp completion cost (materials reported + levy-priced machine time)
      responses:
        "200": {description: the stamp}
        "400": {description: workorder.already.stamped}
  /api/v1/cc/{tenant}/state:
    get:
      summary: The CC:T desk — one read-only poll (quota, windows, forecast, credit)
      parameters:
        - {name: Authorization, in: header, required: true, schema: {type: string}}
      responses:
        "200": {description: "{quotaLimit, msptPredicted, schedulable, tariffLabel, creditStatus, windows[]}"}
        "400": {description: cc.disabled (no token configured) | cc.unauthorized}
  /api/v1/tenants/{tenantId}/signals/ack:
    post:
      summary: Agent acknowledges executed commands (marks DELIVERED)
      parameters: [{name: tenantId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: acked}

components:
  schemas:
    CreateAccountRequest:
      type: object
      required: [accountNo, accountType, currency]
      properties:
        accountNo: {type: string}
        accountType: {type: string, enum: [PLAYER, TEAM, SYSTEM_SINK, SYSTEM_FAUCET, ESCROW]}
        currency: {type: string}
    AccountDto:
      type: object
      properties:
        id: {type: integer, format: int64}
        accountNo: {type: string}
        accountType: {type: string}
        currency: {type: string}
        balanceCents: {type: integer, format: int64}
    JournalLine:
      type: object
      required: [accountNo, direction, amountCents]
      properties:
        accountNo: {type: string}
        direction: {type: string, enum: [DEBIT, CREDIT]}
        amountCents: {type: integer, format: int64, minimum: 1}
        memo: {type: string}
    PostJournalRequest:
      type: object
      required: [idempotencyKey, currency, lines]
      properties:
        idempotencyKey: {type: string}
        currency: {type: string}
        lines: {type: array, items: {$ref: '#/components/schemas/JournalLine'}}
    PostJournalResponse:
      type: object
      properties:
        journalId: {type: string}
        replayed: {type: boolean}
        affectedAccounts: {type: array, items: {$ref: '#/components/schemas/AccountDto'}}
    EventEnvelope:
      type: object
      required: [eventId, type, schemaVersion, agentId]
      properties:
        eventId: {type: string}
        type: {type: string}
        schemaVersion: {type: integer}
        agentId: {type: string}
        tenantId: {type: string}
        occurredAt: {type: string}
        reliability: {type: string, enum: [CRITICAL, TELEMETRY]}
        payload: {type: object}
    TelemetryBatch:
      type: object
      required: [events]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/EventEnvelope'}, maxItems: 1000}
    TelemetryAck:
      type: object
      properties:
        accepted: {type: integer}
        duplicates: {type: integer}
    InventoryLine:
      type: object
      required: [containerId, itemId, amount, capturedAt]
      properties:
        containerId: {type: string}
        itemId: {type: string}
        amount: {type: integer, format: int64}
        capturedAt: {type: string}
    InventoryBatch:
      type: object
      required: [batchMode, lines]
      properties:
        batchMode: {type: string, enum: [SNAPSHOT, DELTA]}
        lines: {type: array, items: {$ref: '#/components/schemas/InventoryLine'}}
    SignalSetCommand:
      type: object
      required: [channel, level]
      properties:
        channel: {type: string}
        level: {type: integer, minimum: 0, maximum: 15}
