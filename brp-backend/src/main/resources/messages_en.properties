# BRP user-facing copy. English canonical. Dark humor budget: SPENT.
# Business behavior stays compliant; only the words judge you.

approval.hr.rejected=Requester is not on the team roster. HR has filed this form under 'no' and wishes you a productive day.
approval.upper.management.required=This amount requires the owner. The buck stops at the top of the org chart.
approval.officer.required=Approvals are an OFFICER+ privilege. Membership alone is a lifestyle, not a credential.
approval.unknown=Unknown request. It may have been archived, or it may never have existed. Both are permanent.
approval.request.closed=This request has already been {0}. Re-litigating decisions is what the quarterly review is for.
approval.nudge.settled=Nudging a settled request is corporate cardio. HR recommends hydration instead.
approval.nudge.ok=Reminder dispatched. Per my last email, the deadline was metaphorical but approaching.
tps.cover.sheet.missing=TPS reports now require a cover sheet. Didn't you get the memo? Everyone got the memo.
generic.bad.request=The request could not be processed. The server is fine; the paperwork was not.
generic.conflict=A conflict occurred. Two threads wanted the same thing, and only one of them was right.
generic.validation=Validation failed on {0}. The form was returned in triplicate.
economy.currency.duplicate=This currency code is already registered. Minting duplicates is a three-letter agency's job.
economy.currency.unknown=Currency {0} is not on the registry. Finance cannot invent money; that is the faucet's job.
quota.machine.exceeded=Tenant {0} hit its machine-slot quota. A farm too far; management has been notified and will circle back.
quota.chunk.incident=Chunk {0} in {1} is eating the server (cost score {2}). Management has been CC'd; the response is above this system's pay grade.
ledger.account.duplicate=This account already exists. Ledgers do not believe in reincarnation.
ledger.account.unknown=The journal references an account that does not exist in this tenant. Imaginary friends cannot hold balances.
ledger.amount.positive=Amounts must be positive; negative booking is not a payment method here.
ledger.concurrent.retry=Another transaction touched the same account first. Retry with the SAME idempotency key; patience is a double-entry virtue.
ledger.currency.mismatch=Journal currency does not match the accounts' currency. Cross-currency legs are a laundering vector, not a feature.
ledger.direction.invalid=Direction must be DEBIT or CREDIT; the third way is not accounted for.
ledger.lines.empty=A journal with no lines books nothing, changes nothing, and impresses no one.
ledger.unbalanced=Debits must equal credits. The universe enforces this; so do we.

# Chunk governance (docs/09) — the meters run, the puns are free.
chunk.registered=Chunk slot booked. The chunk now has a file, a meter, and expectations.
chunk.unknown=No managed chunk under that key. Unregistered chunks are free-range; BRP machinery politely declines to work there.
chunk.grant.invalid=Grant minutes must be positive. Time cannot be gifted in the negative.
chunk.power.off=Chunk {0} ({1}) powered OFF by remote order for tenant {2}. The machines are on strike; the world is not.
chunk.power.on=Chunk {0} ({1}) powered back on for tenant {2}. The strike is over; productivity resumes.
currency.display.updated=Currency display updated. Rebranding is legal; re-identifying is not. The code remains the code.
chunk.credit.exhausted=Chunk {0} ({1}) ran out of credit for tenant {2}. The machines are on strike; the world is not.
chunk.starter.granted=Tenant {0} received a starter bundle of {1} chunk-minutes. Onboarding does not require a loan shark.
inventory.snapshot.negative=SNAPSHOT mode cannot stock negative shelves. Physics declines to participate.
inventory.timestamp.invalid=capturedAt must be an ISO-8601 instant. "Sometime Tuesday" is not a timestamp.
quota.limit.negative=Quota limits cannot be negative. Unlimited is already a setting; it is called zero.
anomaly.rule.hit=Rule {0} tripped on {1} (observed {2}, severity {3}). The number is wrong; management has been CC'd.
anomaly.rule.op.invalid=Op must be one of GT, GTE, LT, LTE, EQ. Poetry is not an operator.
reconciliation.imbalance=Currency {0} is off by {1} cents. Double entry is disappointed in all of us.
monetary.snapshot.duplicate=This week's snapshot already exists. The truth does not take retakes.
monetary.regime.active=The antitrust regime is ACTIVE (Gini {0}). The levies are armed.
monetary.regime.inactive=The antitrust regime is INACTIVE (Gini {0}). Clemency, for now.
monetary.regime.redline=One tenant holds more than half the wealth (share {0}). This is a red line, not a tax rate; a human is being paged.
monetary.wealth.levied=Wealth levy for {0}: {1} cents burned to SYSTEM_SINK. Hoarding has a carrying cost now.
monetary.peg.leg.unknown=Unknown peg leg. There are exactly two; learn them.
monetary.peg.repeg.filed=The {0} leg drifted out of band (peg {1}, market {2}). A re-peg vote has been filed for the OWNER - no third channel was harmed.
monetary.request.unknown=No such policy request. It may never have existed; the result is the same.
monetary.request.closed=This policy request has been decided. Re-litigating anchors is for quarterly reviews.
monetary.request.not.approved=Only APPROVED votes can execute. The band absorbs drift, not enthusiasm.
monetary.vault.unregistered=That vault container is not registered. The mint window does not dispense into folklore.
monetary.vault.item.mismatch=The vault holds a different item than the mint asked for. Anchors are not mix-and-match.
monetary.price.invalid=A price needs an item and a positive amount. No one pays zero for nothing, however enthusiastly.
monetary.cpi.empty=No price moved today; the index refuses to print a flatline.
monetary.wash.suspected=Tenant {0}: {1} wash-cycle finding(s) filed. Cycles are legal commerce; the score carries the accusation.
