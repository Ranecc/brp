# BRP 用户可见文案。中文译本。黑色幽默预算：同样花光。
# 业务行为保持合规，只有措辞在评价你。

approval.hr.rejected=申请人不在团队花名册上。人事部已将该表单归档至「不」字档案柜，并祝您工作愉快。
approval.upper.management.required=该金额需要会长审批。官印到此为止，上面再无他人。
approval.officer.required=审批是 OFFICER 及以上的特权。会籍只是一种生活方式，不是凭证。
approval.unknown=未知的申请。它可能已被归档，也可能从未存在过——两者都是永久的。
approval.request.closed=该申请已经是「{0}」状态。重新审议决策是季度复盘会的事。
approval.nudge.settled=催办一张已结算的工单属于企业级有氧运动。人事部建议您多喝水。
approval.nudge.ok=催办已发出。正如我上一封邮件所说，截止日期是比喻性的，但正在逼近。
tps.cover.sheet.missing=TPS 报告现在必须附封面页。备忘录没发到您那里吗？所有人都收到了。
generic.bad.request=请求无法处理。服务器没问题，是表单的问题。
generic.conflict=发生冲突。两个线程想要同一件东西，只有一个是对的。
generic.validation={0} 校验失败。表格已一式三份退回。
economy.currency.duplicate=该货币代码已登记。重复铸币是三字母机构的职责。
economy.currency.unknown=货币 {0} 未在登记册上。财务不能凭空造币——那是水龙头的职责。
quota.machine.exceeded=租户 {0} 的机器槽位配额已满。农场太超前了，管理层已收到通知并将择日回环。
quota.chunk.incident=区块 {0}（{1}）正在吃掉服务器（开销评分 {2}）。管理层已被抄送，如何处置超出本系统职级。
ledger.account.duplicate=该账户已存在。账本不相信转世。
ledger.account.unknown=分录引用了本租户不存在的账户。想象中的朋友不能持有余额。
ledger.amount.positive=金额必须为正；负数记账在这里不是支付方式。
ledger.concurrent.retry=另一笔事务先动了这个账户。请用同一个幂等键重试；耐心是复式记账的美德。
ledger.currency.mismatch=分录币种与账户币种不符。跨币种借贷是洗钱通道，不是功能。
ledger.direction.invalid=方向只能是 DEBIT 或 CREDIT；第三条路不入账。
ledger.lines.empty=没有分录的记账不记任何东西、不改任何东西、也感动不了任何人。
ledger.unbalanced=有借必有贷。宇宙执行这条规则，我们也执行。

# 区块治理（docs/09）——表在转，梗免费。
chunk.registered=区块槽位已登记。该区块从此有了档案、电表和期望值。
chunk.unknown=该键下没有受管区块。未登记的区块是放养的；BRP 机械谢绝在此务工。
chunk.grant.invalid=授予分钟数必须为正。时间不能倒着送。
chunk.power.off=区块 {0}（{1}）已被远程指令关停（租户 {2}）。机器罢工了，世界没有。
chunk.power.on=区块 {0}（{1}）已为租户 {2} 恢复供电。罢工结束，生产力复工。
currency.display.updated=货币展示信息已更新。改头换面合法，改身份不合法。code 还是那个 code。
chunk.credit.exhausted=区块 {0}（{1}）的信用耗尽（租户 {2}）。机器罢工了，世界没有。
chunk.starter.granted=租户 {0} 已领取 {1} 区块分钟的起家补贴。起家不需要找高利贷。
inventory.snapshot.negative=SNAPSHOT 模式不允许负库存。物理学拒绝配合。
inventory.timestamp.invalid=capturedAt 必须是 ISO-8601 时间。「周二某个时候」不是时间戳。
quota.limit.negative=配额上限不能为负。「无限」已经是一个设置了，它叫零。
anomaly.rule.hit=规则 {0} 在 {1} 上触发（观测值 {2}，级别 {3}）。数字错了；管理层已收件。
anomaly.rule.op.invalid=op 只能是 GT、GTE、LT、LTE、EQ 之一。诗歌不是运算符。
reconciliation.imbalance=币种 {0} 差了 {1} 分。复式记账对我们所有人感到失望。
monetary.snapshot.duplicate=本周快照已存在。真相不接受重拍。
monetary.regime.active=反垄断机制已激活（Gini {0}）。税枪上膛。
monetary.regime.inactive=反垄断机制已解除（Gini {0}。宽限期，暂时的。
monetary.regime.redline=单一租户财富占比过半（份额 {0}）。这是红线不是税率；正在呼叫人类。
monetary.wealth.levied={0} 的财富税：{1} 分已烧入 SYSTEM_SINK。囤币从此有持有成本。
monetary.peg.leg.unknown=未知锚腿。锚腿一共两条；请记住它们。
monetary.peg.repeg.filed={0} 腿漂出锚带（锚价 {1}，市场 {2}）。已为 OWNER 提交重定锚投票——未惊动任何第三条通道。
monetary.request.unknown=查无此政策请求。它可能从未存在过；效果一样。
monetary.request.closed=该政策请求已裁决。反复重审锚价是季度复盘的事。
monetary.request.not.approved=只有 APPROVED 的投票才能执行。锚带吸收漂移，不吸收热情。
monetary.vault.unregistered=该金库容器未登记。铸币窗口不向民间传说发货。
monetary.vault.item.mismatch=金库持物与铸币请求不符。锚不是混搭用的。
monetary.price.invalid=价格需要物品和正数金额。没人为零元买单，无论多热情。
monetary.cpi.empty=今天没有价格变动；指数拒绝印一条直线。
monetary.wash.suspected=租户 {0}：已归档 {1} 条洗钱环路疑点。环路是合法商业；分数扛指控。
# --- P4：负载台（docs/13）---
tariff.day.invalid=星期取值 -1（每天）到 7。日历有边界，电价表也有。
tariff.window.invalid=窗口要有起点、终点，以及两者之间的差。连基荷都有几何形状。
tariff.multiplier.invalid=乘数在 1% 到 10000% 之间。免费电力是礼物，不是价格。
dr.idem.required=申报可推迟工作需要幂等键。官僚主义就是日程表本身。
dr.est.invalid=预计分钟数在 1 到 10080 之间。一周是电网接受的最长承诺。
dr.window.invalid=期限必须晚于最早时间。时间之箭是合规要求。
dr.status.invalid=该作业已经走到了它的结局。只有 FILED 和 AWARDED 可以取消。
dr.state.lost=申报在自己的两行文书之间失踪了。已上报审计科。
dr.job.unknown=没有这个可推迟作业，或者它不是你的。队列很公正，也很谨慎。
credit.limit.invalid=负数的授信额度是送给数学的礼物，不是送给任何人的。
credit.repay.invalid=请偿还正数金额。负数的偿还叫消费。
credit.nothing.drawn=这条额度上没有提款。柜台感谢你的警惕。
credit.no.cash=金库没有现金可还。债务不能自己还自己——这正是不还钱的原因。
credit.not.defaulted=只有 DEFAULTED 状态可以恢复。好消息不需要文书。
credit.overflow=提款余额溢出了长整型。这个规模的资不抵债是数学意义上的。
credit.restricted=信贷柜台冻结了该租户。移动和游玩保持免费；承诺请稍候。
bond.issue.invalid=债券需要面值、期限、规模，以及一张不是彩票的票息。
bond.unknown=没有这个债券系列。从未发行的纸无法到期。
bond.units.invalid=请至少认购一个单位。零单位的债券叫观点。
bond.not.open=认购已截止。迟到的钱等下一个系列。
bond.oversubscribed=认购已满额。热情已记录在案，但不构成配售。
bond.already.subscribed=每个租户每个系列只有一个仓位。你已经在里面了，托管金记得你。
market.idem.required=订单需要幂等键。订单簿什么都记得，尤其是双击。
market.side.invalid=方向是 ASK 或 BID。没有第三个方向，只有后悔。
market.order.invalid=数量和价格必须为正。市场可以是很多东西，但不是慈善机构。
market.price.outside.band=价格击穿了锚带。这里交易的是算力，不是锚本身。
market.peg.unavailable=锚腿缺失。没有锚就没有市场；请先找重锚台。
market.cant.cover=不能出售从未被授予的容量。卖空算力是服务器暴毙的方式。
market.cancel.invalid=只有自己的挂单可以撤。FILLED 不是心情，是事实。
market.fill.mismatch=成交两侧数量不一致。在账本发现之前先停下。
market.state.lost=订单在它自己的键和行之间消失了。审计员已被呼叫。
cc.disabled=电脑柜台已关闭。先配置 brp.cc.token，再让乌龟来读。
cc.unauthorized=令牌不对。乌龟很有耐心，柜台不吃这套。
downtime.window.invalid=停机要有先后的起止。连停机都服从时间之箭。
downtime.state.lost=停机记录在键和行之间消失了。OEE 能扛，审计不能。
asset.invalid=资产需要种类、标签和非负的成本基础。传说不参与折旧。
asset.unknown=没有这个资产，或者它不是你的。登记簿是一本有立场的账。
workorder.cost.invalid=材料成本不能为负。退货不是负成本，是退货。
workorder.already.stamped=这张工单已经盖过章了。篡改是董事会级别的罪行。

# --- P5: the bourse (docs/14) ---
exchange.item.unknown=查无此标的。注册表决定什么存在，腐竹决定什么可交易。
exchange.item.id.invalid=物品 id 需要命名空间。"emerald" 是愿望，不是身份。
exchange.item.not.listed=此物品不可交易。名录商行里，没有行就没有交易。
exchange.catalog.too.large=目录推送每批上限 500。注册表很大，耐心是免费的。
exchange.listing.state.invalid=挂牌状态只有 DEFAULT、LISTED、BLOCKED。即兴发挥属于违规操作。
exchange.listing.ref.required=没有挂牌价就不许上市。国家就是要给世界定价——牌子上写着呢。
exchange.listing.ref.invalid=参考价必须为正。免费样品请去交易所外面发。
exchange.order.tenant.required=订单需要租户。订单簿不是失物招领处。
exchange.order.idem.required=请携带幂等键。钟每五分钟响一次，每次决策只许下一单。
exchange.order.side.invalid=方向只有 ASK 和 BID。交易所交易物品，不交易跨式组合。
exchange.order.invalid=数量和价格必须为正。零是一种情绪，不是一张订单。
exchange.order.state.lost=订单在它自己的键和行之间消失了。审计员已被呼叫。
exchange.cancel.invalid=只有自己的常备单可以撤。FILLED 是事实，不是心情。
exchange.warehouse.qty.invalid=数量必须为正。移动账不记录情绪。
exchange.warehouse.insufficient=可用库存不足。卖你持有的；做空柜台已永久关闭。
exchange.claim.unknown=查无此 claim，或者不是你的。保管权只回答给它的主人。
exchange.claim.closed=该 claim 已了结。确认不退不换。
