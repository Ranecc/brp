# Shared-H2 discipline: ONE live outbox scheduler would let other contexts
# requeue+deliver rows under test; every context's schedulers stay off in
# tests (OutboxFlowTest drives the dispatcher directly).
brp.outbox.poll-ms=3600000
brp.outbox.sweep-ms=3600000
# Same rule for the P4 desks: tests drive award/shed directly, on their own
# clock, not on a background tick that races the assertion.
brp.dr.award-ms=3600000
brp.dr.shed-ms=3600000
