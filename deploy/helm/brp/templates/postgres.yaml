{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "brp.fullname" . }}-postgres
  labels: {app: brp, component: postgres}
spec:
  serviceName: {{ include "brp.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {app: brp, component: postgres}
  template:
    metadata:
      labels: {app: brp, component: postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              value: {{ .Values.db.name }}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "brp.dbSecret" . }}, key: BRP_DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "brp.dbSecret" . }}, key: BRP_DB_PASS}}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", {{ .Values.db.user | quote }}, "-d", {{ .Values.db.name | quote }}]}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "brp.fullname" . }}-postgres
  labels: {app: brp, component: postgres}
spec:
  clusterIP: None
  selector: {app: brp, component: postgres}
  ports: [{port: 5432, targetPort: 5432}]
{{- end }}
