apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brp.fullname" . }}-backend
  labels: {app: brp, component: backend}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: brp, component: backend}
  template:
    metadata:
      labels: {app: brp, component: backend}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8080}]
          env:
            - name: BRP_DB_URL
              value: {{ include "brp.dbUrl" . | quote }}
            - name: BRP_DB_USER
              valueFrom: {secretKeyRef: {name: {{ include "brp.dbSecret" . }}, key: BRP_DB_USER}}
            - name: BRP_DB_PASS
              valueFrom: {secretKeyRef: {name: {{ include "brp.dbSecret" . }}, key: BRP_DB_PASS}}
            - name: BRP_PORT
              value: "8080"
            - name: BRP_SERVER_ADDRESS
              value: 0.0.0.0
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 45
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "brp.fullname" . }}-backend
  labels: {app: brp, component: backend}
spec:
  type: {{ .Values.service.type }}
  selector: {app: brp, component: backend}
  ports: [{port: {{ .Values.service.port }}, targetPort: 8080}]
