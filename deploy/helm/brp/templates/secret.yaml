{{- if not .Values.db.existingSecret }}
{{- if not .Values.db.password }}
{{- fail "db.password is required when db.existingSecret is empty — weak defaults never reach a real machine (docs/15)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brp.dbSecret" . }}
  labels:
    app: brp
type: Opaque
stringData:
  BRP_DB_USER: {{ .Values.db.user | quote }}
  BRP_DB_PASS: {{ .Values.db.password | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_USER: {{ .Values.db.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
  {{- end }}
{{- end }}
