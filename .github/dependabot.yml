version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Spring Boot 4 is a deliberate migration project, not a Tuesday PR
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "gradle"
    directory: "/brp-mod"
    schedule:
      interval: "weekly"
    ignore:
      # The testImplementation pin must stay inside the jarJar range in
      # brp-mod/build.gradle.kts. Dependabot bumps the pin alone: CI stays
      # green, the real-net boot dies on "no suitable driver". Range and pin
      # move together, by hand.
      - dependency-name: "org.xerial:sqlite-jdbc"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
