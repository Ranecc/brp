name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: The sacred ritual (tests)
        run: mvn -B -pl brp-backend -am test

  mod:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: "Install brp-common + build backend jar (embed order: common -> backend -> mod)"
        run: |
          mvn -B -pl brp-common install -DskipTests
          mvn -B -pl brp-backend -am package -DskipTests
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.10' }
      - name: Embed backend fat jar for single-file distribution
        run: |
          mkdir -p brp-mod/src/main/resources/backend
          cp brp-backend/target/brp-backend-*.jar brp-mod/src/main/resources/backend/brp-backend.jar
      - name: Build the universal mod jar
        working-directory: brp-mod
        run: gradle build --no-daemon
