name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test (contract + common + backend)
        run: mvn -B -ntp verify

      - name: Upload backend jars
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            brp-backend/target/*.jar
            !brp-backend/target/*.jar.original
          if-no-files-found: error

  mod:
    name: mod (NeoForge universal jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # brp-mod resolves dev.brp:brp-common from mavenLocal — install it first.
      # Its tests already ran (and must stay green) in the backend job.
      - name: Install brp-common to mavenLocal
        run: mvn -B -ntp -pl brp-common install -DskipTests

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build mod
        working-directory: brp-mod
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            brp-mod/build/libs/*.jar
            !brp-mod/build/libs/*-sources.jar
          if-no-files-found: error

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image (no push — the registry is a P5 concern)
        run: docker build -t brp:ci .
