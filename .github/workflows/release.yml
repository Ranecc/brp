name: Release

# Tag v* → assemble the ONE universal jar with the backend fat jar embedded
# (the 100+ MB tradition we vowed to uphold), attach everything to a GitHub
# Release. Tests are assumed green from CI on the tagged commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package backend (fat jar)
        run: mvn -B -ntp -pl brp-backend -am package -DskipTests

      - name: Embed backend jar into the mod
        run: |
          mkdir -p brp-mod/src/main/resources/backend
          cp brp-backend/target/brp-backend-*.jar \
             brp-mod/src/main/resources/backend/brp-backend.jar
          ls -lh brp-mod/src/main/resources/backend/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Build universal mod jar
        working-directory: brp-mod
        run: gradle build --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            brp-mod/build/libs/*.jar
            !brp-mod/build/libs/*-sources.jar
            brp-backend/target/*.jar
            !brp-backend/target/*.jar.original

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            brp-mod/build/libs/*.jar
            !brp-mod/build/libs/*-sources.jar
            brp-backend/target/*.jar
            !brp-backend/target/*.jar.original
